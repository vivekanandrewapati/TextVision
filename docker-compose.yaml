version: '3.8'

services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://server:4000
    depends_on:
      - server
    networks:
      - texttoimage-network

  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    networks:
      - texttoimage-network

networks:
  texttoimage-network:
    driver: bridge

volumes:
  mongodb_data: